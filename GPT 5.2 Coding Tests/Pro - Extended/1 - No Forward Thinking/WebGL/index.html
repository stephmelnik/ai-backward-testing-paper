<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Procedural Flower Lines (WebGL2)</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0c10;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    #c {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: fixed;
      left: 12px;
      bottom: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(10, 12, 16, 0.55);
      color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 12px;
      line-height: 1.35;
      max-width: min(520px, calc(100vw - 24px));
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      user-select: none;
      pointer-events: none;
    }
    #hud strong { letter-spacing: 0.2px; }
    #hud code {
      padding: 1px 5px;
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <canvas id="c" aria-label="Procedural flower drawing"></canvas>
  <div id="hud">
    <div><strong>Procedural Flower Lines</strong> — WebGL2, point-sprite “pencil” strokes.</div>
    <div>Edit parameters in <code>src/params.js</code>. Resizing the window re-renders.</div>
    <div>Tip: open this file directly, or run a local server (e.g. <code>python -m http.server</code>) if you prefer.</div>
  </div>

  <script src="src/params.js"></script>
  <script src="src/gl-utils.js"></script>
  <script src="src/shaders.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
