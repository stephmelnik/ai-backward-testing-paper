<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Procedural Flower Lines</title>
    <style>
      :root {
        color-scheme: light;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #fdf7f0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      .wrap {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      canvas {
        display: block;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        border-radius: 6px;
      }
      .hint {
        position: fixed;
        left: 14px;
        bottom: 12px;
        font-size: 12px;
        color: rgba(40, 30, 25, 0.55);
        user-select: none;
        background: rgba(253, 247, 240, 0.75);
        backdrop-filter: blur(4px);
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(40, 30, 25, 0.12);
      }
      .hint code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <canvas id="c"></canvas>
    </div>
    <div class="hint">
      <div><strong>Procedural recreation</strong></div>
      <div>Press <code>S</code> to save PNG · <code>R</code> to re-render</div>
      <div>Edit parameters in <code>src/config.js</code></div>
    </div>
    <script defer src="./src/config.js"></script>
    <script defer src="./src/random.js"></script>
    <script defer src="./src/utils.js"></script>
    <script defer src="./src/draw/guilloche.js"></script>
    <script defer src="./src/draw/background.js"></script>
    <script defer src="./src/draw/flower.js"></script>
    <script defer src="./src/main.js"></script>
  </body>
</html>
