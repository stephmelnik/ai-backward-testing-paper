<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Procedural Flower Lines</title>
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #f8f2ee;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font: 14px/1.4 system-ui, sans-serif;
        color: #6b5f5d;
      }

      #fallback[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="Procedural flower line art"></canvas>
    <div id="fallback" hidden>WebGL is required to view this sketch.</div>
    <script src="main.js"></script>
  </body>
</html>
